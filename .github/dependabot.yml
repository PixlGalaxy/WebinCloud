version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    open-pull-requests-limit: 15
    schedule:
      interval: "daily"
    groups:
      frontend-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/backend"
    open-pull-requests-limit: 15
    schedule:
      interval: "daily"
    groups:
      backend-deps:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
    groups:
      docker-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
    groups:
      actions-deps:
        patterns:
          - "*"
