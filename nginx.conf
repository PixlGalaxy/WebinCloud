worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # The entrypoint prefixes every nginx line with [FRONTEND].
    log_format webincloud '$time_iso8601 $status $request_method $request_uri '
                          '${body_bytes_sent}b ${request_time}s "$http_user_agent"';
    access_log /dev/stdout webincloud;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;

        client_max_body_size 0;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            # Also tailed by the backend into the admin panel's own Logs page
            # as a FRONTEND channel — /backend/ below deliberately isn't, since
            # the backend's own request logger already covers those requests.
            access_log /dev/stdout webincloud;
            access_log /tmp/nginx-access.log webincloud;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log /dev/stdout webincloud;
            access_log /tmp/nginx-access.log webincloud;
        }

        # A browser auto-requests /favicon.ico for any page that lacks its own
        # <link rel="icon"> — which is everything served raw under /backend/
        # (a public share's raw download, a JSON API response, etc.), since
        # those aren't the SPA's own index.html. Route it to the same branding
        # endpoint the SPA's <link> tag already uses, so every page shows the
        # real (possibly admin-replaced) favicon instead of falling through to
        # the SPA fallback below and getting HTML back for an icon request.
        location = /favicon.ico {
            proxy_pass http://127.0.0.1:4000/api/branding/favicon.ico;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /backend/ {
            proxy_pass http://127.0.0.1:4000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
