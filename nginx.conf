worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # The entrypoint prefixes every nginx line with [FRONTEND].
    log_format webincloud '$time_iso8601 $status $request_method $request_uri '
                          '${body_bytes_sent}b ${request_time}s "$http_user_agent"';
    # Health checks from uptime monitors and proxies arrive around the clock;
    # a healthy answer is noise, a failing one is still logged. Matched on the
    # normalised path, exactly, so "/backend/api/health/../files/..." cannot
    # borrow the exemption to stay out of the log.
    map "$status:$uri" $loggable {
        "~^2\d\d:/backend/api/health$" 0;
        default                        1;
    }
    access_log /dev/stdout webincloud if=$loggable;

    # Upload sockets (/backend/api/uploads/socket) need the upgrade passed on; every
    # other request keeps the plain "Connection: close" nginx sends upstream by default.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;

        client_max_body_size 0;

        # Baseline hardening for every response. nginx drops server-level
        # add_header lines in any location that sets its own, so /assets/
        # repeats them below.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        root /usr/share/nginx/html;
        index index.html;

        # Banned addresses (by an admin) and blocked ones (probing for missing
        # paths) get nothing: before a page, asset or icon is served, nginx asks
        # the backend, and a "no" closes the connection without an answer (444).
        # The backend applies the same rule to /backend/ itself.
        location = /_gate {
            internal;
            proxy_pass http://127.0.0.1:4000/api/internal/gate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # While the backend restarts, pages keep loading as they always did.
            error_page 500 502 503 504 = @gate_open;
            access_log off;
        }
        location @gate_open {
            access_log off;
            return 204;
        }
        location @close {
            return 444;
        }
        # A file that does not exist: counted toward the scanner block, then 404.
        location @miss {
            rewrite ^ /api/internal/miss break;
            proxy_pass http://127.0.0.1:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            access_log /dev/stdout webincloud;
            access_log /tmp/nginx-access.log webincloud;
        }

        # Odd paths at the root (/site.zip, /.env, /wp-login.php, /.git/...): the
        # app has no page there, so instead of the SPA fallback they are misses.
        location ~ ^/(\.|[^/]*\.[^/]*$) {
            auth_request /_gate;
            error_page 403 = @close;
            try_files $uri @miss;
            access_log /dev/stdout webincloud;
            access_log /tmp/nginx-access.log webincloud;
        }

        location / {
            auth_request /_gate;
            error_page 403 = @close;
            try_files $uri $uri/ /index.html;
            # Also tailed by the backend into the admin panel's own Logs page
            # as a FRONTEND channel — /backend/ below deliberately isn't, since
            # the backend's own request logger already covers those requests.
            access_log /dev/stdout webincloud;
            access_log /tmp/nginx-access.log webincloud;
        }

        location /assets/ {
            auth_request /_gate;
            error_page 403 = @close;
            error_page 404 = @miss;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            access_log /dev/stdout webincloud;
            access_log /tmp/nginx-access.log webincloud;
        }

        # A browser auto-requests /favicon.ico for any page that lacks its own
        # <link rel="icon"> — which is everything served raw under /backend/
        # (a public share's raw download, a JSON API response, etc.), since
        # those aren't the SPA's own index.html. Route it to the same branding
        # endpoint the SPA's <link> tag already uses, so every page shows the
        # real (possibly admin-replaced) favicon instead of falling through to
        # the SPA fallback below and getting HTML back for an icon request.
        location = /favicon.ico {
            auth_request /_gate;
            error_page 403 = @close;
            proxy_pass http://127.0.0.1:4000/api/branding/favicon.ico;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /backend/ {
            proxy_pass http://127.0.0.1:4000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Some backend routes set nosniff themselves; keep only the server-level copy.
            proxy_hide_header X-Content-Type-Options;
            # The backend marks its event streams (dashboard metrics, logs, folder
            # changes) with X-Accel-Buffering: no. nginx swallows X-Accel-* headers
            # from upstream by default; pass this one on so an outer nginx (e.g.
            # Nginx Proxy Manager) also streams them instead of buffering or
            # compressing them into silence.
            proxy_pass_header X-Accel-Buffering;
            # The backend answers banned and blocked addresses with 444: close the connection.
            proxy_intercept_errors on;
            error_page 444 = @close;

            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
