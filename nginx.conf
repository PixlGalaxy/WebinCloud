log_format webincloud '[FRONTEND] $time_iso8601 $status $request_method $request_uri '
                      '${body_bytes_sent}b ${request_time}s "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /dev/stdout webincloud;

    # Large uploads stream straight through to the backend.
    client_max_body_size 0;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Trailing slash strips the /backend prefix: /backend/api/x -> /api/x
    location /backend/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
